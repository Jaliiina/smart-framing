<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AestheticCropper - 智能取景系统</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AestheticCropper</h1>
            <p>基于多特征融合的智能取景系统</p>
        </header>

        <main>
            <!-- Image Input Area -->
            <section class="input-section">
                <h2>图像输入</h2>
                <div class="upload-area">
                    <input type="file" id="singleImage" accept="image/*" hidden>
                    <button onclick="document.getElementById('singleImage').click()">选择单张图像</button>
                    <input type="file" id="batchImages" accept="image/*" multiple hidden>
                    <button onclick="document.getElementById('batchImages').click()">批量上传图像</button>
                </div>
            </section>

            <!-- Operation Buttons -->
            <section class="action-section">
                <button id="btnCrop" onclick="startCrop()" disabled>开始取景</button>
                <button id="btnDownloadAll" onclick="downloadAllCrops()" disabled style="display:none">下载全部裁剪图</button>
                <button id="btnExport" onclick="exportAllCoords()" disabled style="display:none">导出全部坐标</button>
            </section>

            <!-- Results Area (unified for single + batch) -->
            <section id="resultsSection" class="results-section" style="display:none">
                <div class="results-header">
                    <h2>取景结果</h2>
                    <div id="batchNav" class="batch-nav" style="display:none">
                        <button id="btnPrev" onclick="navigateResult(-1)" disabled>&lt; 上一张</button>
                        <span id="navInfo">1 / 1</span>
                        <button id="btnNext" onclick="navigateResult(1)" disabled>下一张 &gt;</button>
                    </div>
                </div>
                <div id="resultsContainer" class="results-container"></div>
            </section>

            <!-- Advanced Settings -->
            <section class="settings-section">
                <h2>高级设置</h2>
                <details>
                    <summary>展开参数调整</summary>
                    <div class="settings-grid">
                        <div class="setting-item">
                            <label>美学权重</label>
                            <input type="range" id="wAesthetic" min="0" max="0.5" step="0.05" value="0.20">
                            <span id="wAestheticVal">0.20</span>
                        </div>
                        <div class="setting-item">
                            <label>显著性权重</label>
                            <input type="range" id="wSaliency" min="0" max="0.5" step="0.05" value="0.18">
                            <span id="wSaliencyVal">0.18</span>
                        </div>
                        <div class="setting-item">
                            <label>构图权重</label>
                            <input type="range" id="wComposition" min="0" max="0.5" step="0.05" value="0.18">
                            <span id="wCompositionVal">0.18</span>
                        </div>
                        <div class="setting-item">
                            <label>主体权重</label>
                            <input type="range" id="wSubject" min="0" max="0.5" step="0.05" value="0.16">
                            <span id="wSubjectVal">0.16</span>
                        </div>
                        <div class="setting-item">
                            <label>技术权重</label>
                            <input type="range" id="wTechnical" min="0" max="0.5" step="0.05" value="0.05">
                            <span id="wTechnicalVal">0.05</span>
                        </div>
                        <div class="setting-item">
                            <label>面积先验权重</label>
                            <input type="range" id="wAreaPrior" min="0" max="0.5" step="0.05" value="0.18">
                            <span id="wAreaPriorVal">0.18</span>
                        </div>
                    </div>
                </details>
            </section>
        </main>
    </div>

    <script>
        let allResults = [];    // all processed results
        let currentIdx = 0;     // current displayed result index
        let currentImageFile = null;
        let batchFiles = null;

        // --- Upload handlers ---
        document.getElementById('singleImage').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                currentImageFile = e.target.files[0];
                batchFiles = null;
                document.getElementById('btnCrop').disabled = false;
            }
        });

        document.getElementById('batchImages').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                batchFiles = e.target.files;
                currentImageFile = null;
                document.getElementById('btnCrop').disabled = false;
            }
        });

        function startCrop() {
            if (currentImageFile) {
                cropSingle();
            } else if (batchFiles) {
                cropBatch();
            }
        }

        // --- Single image ---
        function cropSingle() {
            const formData = new FormData();
            formData.append('image', currentImageFile);
            setProcessing(true);

            fetch('/api/crop', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if (data.error) { alert('Error: ' + data.error); return; }
                allResults = [{ filename: currentImageFile.name, ...data }];
                currentIdx = 0;
                showResults();
            })
            .catch(err => alert('Request failed: ' + err))
            .finally(() => setProcessing(false));
        }

        // --- Batch ---
        function cropBatch() {
            const formData = new FormData();
            for (let f of batchFiles) formData.append('images', f);
            setProcessing(true);

            fetch('/api/batch', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if (data.error) { alert('Error: ' + data.error); return; }
                allResults = data.results;
                currentIdx = 0;
                showResults();
            })
            .catch(err => alert('Request failed: ' + err))
            .finally(() => setProcessing(false));
        }

        function setProcessing(on) {
            const btn = document.getElementById('btnCrop');
            btn.disabled = on;
            btn.textContent = on ? '处理中...' : '开始取景';
        }

        // --- Display results ---
        function showResults() {
            const section = document.getElementById('resultsSection');
            section.style.display = 'block';

            const isBatch = allResults.length > 1;
            document.getElementById('batchNav').style.display = isBatch ? 'flex' : 'none';
            document.getElementById('btnDownloadAll').style.display = allResults.length > 1 ? 'inline-block' : 'none';
            document.getElementById('btnExport').style.display = allResults.length > 0 ? 'inline-block' : 'none';
            document.getElementById('btnDownloadAll').disabled = false;
            document.getElementById('btnExport').disabled = false;

            renderCurrentResult();
            updateNav();
        }

        function renderCurrentResult() {
            const r = allResults[currentIdx];
            const container = document.getElementById('resultsContainer');

            if (r.error) {
                container.innerHTML = `<div class="result-card"><p class="error-msg"><strong>${r.filename}</strong>: Error - ${r.error}</p></div>`;
                return;
            }

            const subScores = r.sub_scores || {};
            container.innerHTML = `
                <div class="result-card">
                    <div class="result-filename">${r.filename || '结果'}</div>
                    <div class="result-images">
                        <div class="result-img-panel">
                            <p class="result-img-label">原图 + 取景框</p>
                            <img src="${r.original_image}" alt="Original with bbox">
                        </div>
                        <div class="result-img-panel">
                            <p class="result-img-label">裁剪结果</p>
                            <img src="${r.crop_image}" alt="Cropped">
                            <button class="btn-download-crop" onclick="downloadCrop(${currentIdx})">下载裁剪图</button>
                        </div>
                    </div>
                    <div class="result-scores">
                        <div class="score-item-main">
                            <span class="score-label">综合得分</span>
                            <span class="score-value">${r.score.toFixed(4)}</span>
                        </div>
                        <div class="score-item-sub">
                            <span>美学 ${subScores.aesthetic !== undefined ? subScores.aesthetic.toFixed(3) : '--'}</span>
                            <span>显著性 ${subScores.saliency !== undefined ? subScores.saliency.toFixed(3) : '--'}</span>
                            <span>构图 ${subScores.composition !== undefined ? subScores.composition.toFixed(3) : '--'}</span>
                            <span>主体 ${subScores.subject !== undefined ? subScores.subject.toFixed(3) : '--'}</span>
                            <span>技术 ${subScores.technical !== undefined ? subScores.technical.toFixed(3) : '--'}</span>
                            <span>面积 ${subScores.area_prior !== undefined ? subScores.area_prior.toFixed(3) : '--'}</span>
                        </div>
                    </div>
                    <div class="result-details">
                        <details>
                            <summary>详细评分</summary>
                            <div class="detail-grid">
                                ${Object.entries({
                                    thirds: '三分法', center_balance: '中心平衡', whitespace: '留白',
                                    edge_simplicity: '边缘简洁', symmetry: '对称性',
                                    sharpness: '清晰度', brightness: '亮度', contrast: '对比度', saturation: '饱和度'
                                }).map(([k, label]) => {
                                    const val = r.sub_scores && r.sub_scores[k];
                                    return val !== undefined ? `<div class="detail-item"><span>${label}</span><span>${val.toFixed(4)}</span></div>` : '';
                                }).join('')}
                            </div>
                        </details>
                    </div>
                    <div class="result-explanation">${r.explanation}</div>
                    <div class="result-bbox">bbox: [${r.bbox.join(', ')}]</div>
                </div>
            `;
        }

        // --- Navigation ---
        function navigateResult(delta) {
            currentIdx = Math.max(0, Math.min(allResults.length - 1, currentIdx + delta));
            renderCurrentResult();
            updateNav();
        }

        function updateNav() {
            if (allResults.length <= 1) return;
            document.getElementById('navInfo').textContent = `${currentIdx + 1} / ${allResults.length}`;
            document.getElementById('btnPrev').disabled = currentIdx === 0;
            document.getElementById('btnNext').disabled = currentIdx === allResults.length - 1;
        }

        // --- Download ---
        function downloadCrop(idx) {
            const r = allResults[idx];
            if (!r || !r.crop_image) return;
            const link = document.createElement('a');
            link.href = r.crop_image;
            link.download = (r.filename || 'crop').replace(/\.[^.]+$/, '') + '_crop.jpg';
            link.click();
        }

        function downloadAllCrops() {
            for (let i = 0; i < allResults.length; i++) {
                setTimeout(() => downloadCrop(i), i * 300);
            }
        }

        function exportAllCoords() {
            const coords = allResults.map(r => ({
                filename: r.filename,
                bbox: r.bbox,
                score: r.score,
                explanation: r.explanation,
                sub_scores: r.sub_scores,
            }));
            const blob = new Blob([JSON.stringify(coords, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'crop_coords.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        // --- Weight sliders ---
        ['wAesthetic', 'wSaliency', 'wComposition', 'wSubject', 'wTechnical', 'wAreaPrior'].forEach(id => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(id + 'Val');
            if (el && valEl) {
                el.addEventListener('input', function() { valEl.textContent = this.value; });
            }
        });
    </script>
</body>
</html>
