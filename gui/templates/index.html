<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AestheticCropper · 智能美学裁剪</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <style>
        /* ========== 全局重置 & 毛玻璃 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 24px;
            background-image: url('http://localhost:5000/static/2.jpg'),
                linear-gradient(145deg, rgba(160,195,215,0.25) 0%, rgba(200,220,235,0.15) 40%, rgba(120,160,185,0.20) 100%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 6px),
                linear-gradient(135deg, #d4e3ed 0%, #eaf2f7 50%, #c8dae5 100%);
            background-size: cover, auto, cover;
            background-attachment: fixed, fixed, fixed;
            background-blend-mode: normal, normal, normal;
            color: #1e2f3a;
        }
        .container { max-width: 1400px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
        .glass-card {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 20px 60px rgba(60,100,130,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
            padding: 24px 28px;
            margin-bottom: 24px;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(200,225,240,0.10), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .glass-card > * { position: relative; z-index: 1; }
        .glass-card-header { background: rgba(255,255,255,0.30); backdrop-filter: blur(24px) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,0.35); }
        h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; color: #1e2f3a; }
        h1 { font-size: 28px; display: flex; align-items: center; gap: 12px; }
        h1 small { font-weight: 400; font-size: 16px; opacity: 0.65; }
        h2 { font-size: 20px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
        h2 .deco { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #7fa5b9; opacity: 0.6; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 22px; border: none; border-radius: 12px;
            font-family: inherit; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease;
            background: rgba(127,165,185,0.45); backdrop-filter: blur(4px);
            color: #1e2f3a; border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 4px 12px rgba(60,100,130,0.08);
        }
        .btn:hover { transform: translateY(-2px); background: rgba(127,165,185,0.65); box-shadow: 0 8px 24px rgba(60,100,130,0.15); }
        .btn-primary { background: rgba(108,139,159,0.65); color: #f0f6fa; }
        .btn-primary:hover { background: rgba(108,139,159,0.85); }
        .btn-secondary { background: rgba(200,215,225,0.50); }
        .btn-secondary:hover { background: rgba(200,215,225,0.70); }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .upload-area {
            border: 2px dashed rgba(120,160,185,0.40); border-radius: 18px; padding: 36px 20px;
            text-align: center; cursor: pointer; transition: all 0.3s ease;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
            min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        }
        .upload-area:hover { border-color: rgba(108,139,159,0.60); background: rgba(255,255,255,0.25); transform: scale(1.005); }
        .upload-area .icon { font-size: 32px; opacity: 0.6; }
        .upload-area .hint { font-size: 15px; opacity: 0.7; font-weight: 400; }
        .upload-area .sub-hint { font-size: 13px; opacity: 0.45; }
        .error { color: #b35a4a; background: rgba(200,110,100,0.10); padding: 10px 16px; border-radius: 10px; border-left: 4px solid #b35a4a; margin: 8px 0; font-size: 14px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2.5px solid rgba(120,160,185,0.20); border-top-color: #7fa5b9; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .status-badge { font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.20); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.15); }

        /* ====== 权重面板（修复排版） ====== */
        .weights-panel {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px 24px;
            overflow-x: auto;
            padding: 4px 0 2px;;
        }
        .weight-slider {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .weight-slider label {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.75;
            white-space: nowrap;
        }
        .weight-slider input[type="range"] {
            width: 100px; /* 固定宽度或 flex: 1 */
            flex: 0 0 80px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(120,160,185,0.30);
            border-radius: 4px;
        }
        .weight-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #7fa5b9;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.8);
        }
        .weight-slider span {
            width: 360degpx;
            text-align: right;
            font-size: 13px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* ====== 智能裁剪结果 ====== */
        .result-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 18px; }
        .result-card { flex: 1 1 260px; min-width: 180px; border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.20); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.30); }
        .result-card img { width: 100%; height: auto; max-height: 320px; object-fit: contain; display: block; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .result-card .info { padding: 12px 16px; font-size: 14px; font-weight: 500; }
        .subscore-bars { margin-top: 12px; padding: 8px 12px; background: rgba(255,255,255,0.15); border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); }
        .subscore-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; }
        .subscore-row .label { width: 60px; opacity: 0.7; flex-shrink: 0; }
        .subscore-row .bar-track { flex: 1; height: 5px; background: rgba(120,160,185,0.20); border-radius: 4px; overflow: hidden; }
        .subscore-row .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7fa5b9, #5a7f94); transition: width 0.6s ease; width: 0%; }
        .subscore-row .value { width: 34px; text-align: right; opacity: 0.8; font-variant-numeric: tabular-nums; }
        .candidate-list { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
        .candidate-item { width: 150px; text-align: center; background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); border-radius: 14px; padding: 8px 8px 12px; border: 1px solid rgba(255,255,255,0.20); }
        .candidate-item img { width: 100%; height: auto; max-height: 120px; object-fit: contain; border-radius: 8px; }
        .candidate-item .score-label { font-size: 12px; font-weight: 500; margin-top: 6px; opacity: 0.8; }

        /* ====== 批量结果卡片 ====== */
        .batch-result-card { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 16px 20px; margin-bottom: 12px; background: rgba(255,255,255,0.10); backdrop-filter: blur(4px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); }
        .batch-thumbs { display: flex; gap: 18px; flex-shrink: 0; align-items: flex-start; }
        .batch-thumb-wrapper { text-align: center; width: 320px; }
        .batch-thumb-wrapper img { width: 100%; height: auto; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25); display: block; }
        .batch-thumb-wrapper .label { font-size: 12px; opacity: 0.6; margin-top: 4px; font-weight: 500; }
        .cand-selector { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; justify-content: center; }
        .cand-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; color: #1e2f3a; opacity: 0.7; }
        .cand-btn:hover { background: rgba(255,255,255,0.3); opacity: 1; }
        .cand-btn.active { background: rgba(127,165,185,0.5); border-color: rgba(127,165,185,0.6); opacity: 1; }
        .batch-info { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
        .batch-info .top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
        .batch-info .top-row .fname { font-weight: 600; font-size: 15px; }
        .batch-info .top-row .bbox { opacity: 0.5; font-size: 13px; }
        .batch-info .top-row .score { font-weight: 600; color: #4a6a7a; font-size: 15px; }
        .batch-subscore-compact { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; opacity: 0.85; padding-top: 2px; }
        .batch-subscore-compact .item { display: flex; align-items: center; gap: 4px; }
        .batch-subscore-compact .item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7fa5b9; opacity: 0.5; }
        .batch-actions { display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
        .batch-actions .btn { padding: 6px 16px; font-size: 13px; }

        /* ====== 历史记录 ====== */
        .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; padding-right: 4px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.12); backdrop-filter: blur(4px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); font-size: 13px; transition: background 0.2s; cursor: pointer; }
        .history-item:hover { background: rgba(255,255,255,0.22); }
        .history-item .left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .history-item .left .name { font-weight: 500; }
        .history-item .left .meta { opacity: 0.4; font-size: 12px; }
        .history-item .badge { background: rgba(127,165,185,0.20); padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .history-empty { text-align: center; padding: 20px; opacity: 0.4; font-size: 14px; }

        /* ====== 模态框 ====== */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(60,100,130,0.45); backdrop-filter: blur(12px); align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: rgba(255,255,255,0.70); backdrop-filter: blur(32px); border-radius: 28px; border: 1px solid rgba(255,255,255,0.50); padding: 32px 36px; max-width: 700px; width: 92%; max-height: 90vh; overflow-y: auto; box-shadow: 0 40px 80px rgba(60,100,130,0.20); animation: modalFadeIn 0.25s ease; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-close { float: right; font-size: 28px; font-weight: 300; line-height: 1; cursor: pointer; opacity: 0.5; transition: opacity 0.2s, transform 0.2s; background: none; border: none; color: #1e2f3a; }
        .modal-close:hover { opacity: 0.9; transform: rotate(90deg); }
        .modal-content img { max-width: 100%; max-height: 400px; height: auto; border-radius: 14px; border: 1px solid rgba(255,255,255,0.25); margin: 12px 0; }
        .modal-content .meta { font-size: 14px; line-height: 1.7; color: #1e2f3a; word-break: break-word; background: rgba(255,255,255,0.12); padding: 12px 16px; border-radius: 12px; margin-top: 8px; }
        .batch-detail-item { display: flex; gap: 16px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.08); align-items: flex-start; }
        .batch-detail-item:last-child { border-bottom: none; }
        .batch-detail-item img { width: 120px; height: auto; border-radius: 8px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); }
        .batch-detail-item .info { flex: 1; font-size: 13px; }
        .batch-detail-item .info .fname { font-weight: 600; }

        /* ====== Tab 样式 ====== */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; padding-bottom: 2px; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; font-size: 15px; font-weight: 500; color: rgba(30,47,58,0.5); cursor: pointer; border-radius: 12px 12px 0 0; transition: all 0.2s; }
        .tab-btn:hover { color: #1e2f3a; background: rgba(255,255,255,0.1); }
        .tab-btn.active { color: #1e2f3a; background: rgba(255,255,255,0.25); border-bottom: 2px solid #7fa5b9; }
        .tab-content { display: none; padding-top: 8px; }
        .tab-content.active { display: block; }

        /* ====== 手动精修（大图显示） ====== */
        .manual-container { display: flex; flex-wrap: wrap; gap: 24px; }
        .manual-left { flex: 2; min-width: 300px; }
        .manual-right { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 16px; }
        .img-wrapper { position: relative; background: rgba(0,0,0,0.05); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        .img-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
        }
        .img-wrapper .cropper-view-box { border-color: #7fa5b9; }
        .img-wrapper .cropper-line, .img-wrapper .cropper-point { background-color: #7fa5b9; }
        .control-group { background: rgba(255,255,255,0.15); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.15); }
        .control-group label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; opacity: 0.8; margin-top: 8px; }
        .control-group input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: rgba(120,160,185,0.30); border-radius: 4px; outline: none; }
        .control-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #7fa5b9; cursor: pointer; border: 2px solid rgba(255,255,255,0.8); }
        .ratio-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .ratio-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .ratio-btn:hover { background: rgba(255,255,255,0.25); }
        .ratio-btn.active { background: rgba(127,165,185,0.4); border-color: #7fa5b9; }

        /* ====== 可视化诊断 ====== */
        .viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .viz-card { background: rgba(255,255,255,0.10); border-radius: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.12); text-align: center; }
        .viz-card img { width: 100%; height: auto; max-height: 300px; object-fit: contain; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .viz-card .placeholder { color: rgba(30,47,58,0.5); font-size: 14px; padding: 40px 0; }
        .viz-card h4 { margin-top: 8px; font-size: 14px; opacity: 0.7; }
        .viz-card canvas { max-width: 100%; max-height: 260px; margin: 0 auto; }

        /* 响应式 */
        @media (max-width: 768px) {
            .manual-container { flex-direction: column; }
            .manual-left, .manual-right { flex: 1; }
            .viz-grid { grid-template-columns: 1fr; }
            .batch-thumb-wrapper { width: 200px; }
        }
        @media (max-width: 480px) {
            .batch-thumb-wrapper { width: 150px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ======== 标题 ======== -->
    <div class="glass-card glass-card-header">
        <h1>
            <span>📸 AestheticCropper</span>
            <small>智能美学裁剪 · 多特征融合</small>
            <span style="margin-left:auto;font-size:14px;font-weight:400;opacity:0.5;">v2.7</span>
        </h1>
        <p style="margin-top:4px;opacity:0.6;font-size:15px;font-weight:400;">
            基于显著性 · 美学 · 构图 · 主体 · 技术的智能裁剪系统
        </p>
    </div>

    <!-- ======== 权重调节面板 ======== -->
    <div class="glass-card">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px;">
            <h2 style="margin-bottom:0;"><span class="deco"></span> 融合权重</h2>
            <span class="status-badge" id="weightStatus">实时调节</span>
        </div>
        <div class="weights-panel" id="weightsPanel"></div>
        <div class="btn-group" style="margin-top:8px;">

            
            <button class="btn btn-primary" id="applyWeightsBtn">✦ 应用当前权重</button>
            <button class="btn btn-secondary" id="resetWeightsBtn">↺ 重置默认</button>
            <span id="weightStatusMsg" style="font-size:14px;opacity:0.5;align-self:center;margin-left:4px;"></span>
        </div>
    </div>

    <!-- ======== 单图处理 ======== -->
    <div class="glass-card" id="singleCard">
        <h2><span class="deco"></span> 单图处理</h2>

        <!-- 上传区域 -->
        <div class="upload-area" id="singleUploadArea">
            <div class="icon">🖼️</div>
            <div class="hint">点击或拖拽上传单张图片</div>
            <div class="sub-hint">支持 JPG / PNG / WebP</div>
            <input type="file" id="singleFileInput" accept="image/jpeg,image/png,image/webp,image/jpg" style="display:none">
        </div>

        <!-- Tab 导航 -->
        <div class="tabs" id="singleTabs">
            <button class="tab-btn active" data-tab="smart">🤖 智能裁剪</button>
            <button class="tab-btn" data-tab="manual">🛠️ 手动精修</button>
            <button class="tab-btn" data-tab="viz">📊 可视化诊断</button>
        </div>

        <!-- Tab 内容 -->
        <div id="singleTabContent">
            <!-- 智能裁剪 -->
            <div class="tab-content active" id="tab-smart">
                <div id="singleResult" class="mt-16"></div>
            </div>
            <!-- 手动精修 -->
            <div class="tab-content" id="tab-manual">
                <div id="manualContainer" class="manual-container">
                    <div class="manual-left">
                        <div class="img-wrapper" id="manualImageWrapper">
                            <img id="manualImage" src="" alt="上传图片后显示">
                        </div>
                        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
                            <button class="btn btn-primary" id="manualResetBtn">↻ 重置裁剪</button>
                            <button class="btn btn-secondary" id="manualDownloadBtn">⬇ 下载裁剪结果</button>
                            <button class="btn btn-secondary" id="manualApplyOriginalBtn">📷 使用原图</button>
                        </div>
                    </div>
                    <div class="manual-right">
                        <div class="control-group">
                            <div style="font-weight:600; margin-bottom:6px;">📐 裁剪比例</div>
                            <div class="ratio-btns" id="ratioBtns">
                                <button class="ratio-btn active" data-ratio="free">自由</button>
                                <button class="ratio-btn" data-ratio="1:1">1:1</button>
                                <button class="ratio-btn" data-ratio="4:3">4:3</button>
                                <button class="ratio-btn" data-ratio="16:9">16:9</button>
                                <button class="ratio-btn" data-ratio="3:2">3:2</button>
                                <button class="ratio-btn" data-ratio="original">原始</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <div style="font-weight:600; margin-bottom:6px;">🎨 图像调整</div>
                            <label>亮度 <span id="brightnessVal">0</span></label>
                            <input type="range" id="brightnessSlider" min="-100" max="100" value="0">
                            <label>对比度 <span id="contrastVal">0</span></label>
                            <input type="range" id="contrastSlider" min="-100" max="100" value="0">
                            <label>饱和度 <span id="saturationVal">0</span></label>
                            <input type="range" id="saturationSlider" min="-100" max="100" value="0">
                            <label>色调 <span id="hueVal">0</span></label>
                            <input type="range" id="hueSlider" min="-180" max="180" value="0">
                            <button class="btn btn-secondary" id="resetAdjustmentsBtn" style="margin-top:8px; width:100%;">↺ 重置调整</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 可视化诊断 -->
            <div class="tab-content" id="tab-viz">
                <div id="vizContainer" class="viz-grid">
                    <div class="viz-card">
                        <h4>🔥 显著性热力图</h4>
                        <img id="vizSaliency" src="" alt="显著性热力图">
                        <div class="placeholder" id="saliencyPlaceholder" style="display:none;">⏳ 等待后端支持</div>
                    </div>
                    <div class="viz-card">
                        <h4>🎯 主体检测</h4>
                        <img id="vizObjects" src="" alt="主体检测">
                        <div class="placeholder" id="objectsPlaceholder" style="display:none;">⏳ 等待后端支持</div>
                    </div>
                    <div class="viz-card">
                        <h4>📊 构图评分雷达图</h4>
                        <canvas id="radarChart" width="300" height="260"></canvas>
                    </div>
                </div>
                <div style="margin-top:12px;">
                    <button class="btn btn-secondary" id="refreshVizBtn">🔄 刷新可视化</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== 批量处理 ======== -->
    <div class="glass-card">
        <h2><span class="deco"></span> 批量处理</h2>
        <div class="upload-area" id="batchUploadArea">
            <div class="icon">📂</div>
            <div class="hint">点击选择多张图片</div>
            <div class="sub-hint">可一次上传多张，批量裁剪</div>
            <input type="file" id="batchFileInput" accept="image/jpeg,image/png,image/webp,image/jpg" multiple style="display:none">
        </div>
        <div id="batchResult" class="mt-16"></div>
        <div class="btn-group" style="margin-top:14px;">
            <button class="btn btn-secondary" id="exportJsonBtn">📄 导出 JSON</button>
            <button class="btn btn-secondary" id="exportCsvBtn">📊 导出 CSV</button>
            <button class="btn btn-secondary" id="clearBatchBtn">🗑️ 清空结果</button>
        </div>
    </div>

    <!-- ======== 处理历史 ======== -->
    <div class="glass-card">
        <h2><span class="deco"></span> 处理历史 <span style="font-size:14px;font-weight:400;opacity:0.4;margin-left:8px;">（最近20条）</span></h2>
        <div id="historyContainer"><div class="history-empty">暂无处理记录</div></div>
        <div class="btn-group" style="margin-top:10px;">
            <button class="btn btn-secondary" id="clearHistoryBtn">🗑️ 清空历史</button>
        </div>
    </div>
</div>

<!-- ======== 模态框 ======== -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <h3 style="margin-bottom:4px;">📷 裁剪详情</h3>
        <img id="modalCropImage" src="" alt="裁剪图" style="display:block;">
        <div class="meta" id="modalInfo">加载中...</div>
    </div>
</div>

<script>
    // ============================================================
    //  【完整脚本】包含全部功能 + 手动裁剪默认大图 + 雷达图自动呈现
    // ============================================================

    // ---------- 全局状态 ----------
    let currentWeights = {};
    let batchProcessedData = [];
    let history = [];
    const DEFAULT_WEIGHTS = { aesthetic: 0.25, saliency: 0.25, composition: 0.20, subject: 0.18, technical: 0.12, area_prior: 0.00 };
    const MAX_HISTORY = 20;
    let cropper = null;
    let adjustParams = { brightness: 0, contrast: 0, saturation: 0, hue: 0 };
    let currentImageData = null;          // 保留兼容，不再用于手动精修
    let rawImageData = null;              // 存储原始无框图像
    let radarChartInstance = null;

    // ---------- 工具函数 ----------
    function $(id) { return document.getElementById(id); }
    function clearContainer(id) { const el = $(id); if (el) el.innerHTML = ''; }
    function formatNum(v) { return Number(v).toFixed(4); }
    function formatTime(ts) { const d = new Date(ts); return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
    function downloadBase64Image(b64, name) { const a=document.createElement('a'); a.href=b64; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

    // ---------- 权重面板 ----------
    function renderWeightSliders(weights) {
        const panel = $('weightsPanel');
        panel.innerHTML = '';
        const keys = ['aesthetic','saliency','composition','subject','technical','area_prior'];
        const labels = {
            aesthetic: '美学',
            saliency: '显著性',
            composition: '构图',
            subject: '主体',
            technical: '技术',
            area_prior: '面积先验'
        };
        keys.forEach(key => {
            const div = document.createElement('div');
            div.className = 'weight-slider';
            const val = (weights && weights[key] !== undefined) ? weights[key] : 0;
            div.innerHTML = `
                <label>${labels[key]}</label>
                <input type="range" id="slider_${key}" min="0" max="1" step="0.01" value="${val}">
                <span id="val_${key}">${Number(val).toFixed(2)}</span>
            `;
            const slider = div.querySelector('input');
            slider.addEventListener('input', (e) => {
                const v = parseFloat(e.target.value);
                div.querySelector('span').textContent = v.toFixed(2);
                currentWeights[key] = v;
            });
            panel.appendChild(div);
        });
    }

    async function loadConfig() {
        try {
            const resp = await fetch('/api/config');
            if (!resp.ok) throw new Error('配置加载失败');
            const config = await resp.json();
            const w = config.fusion?.weights || DEFAULT_WEIGHTS;
            const filtered = {};
            ['aesthetic','saliency','composition','subject','technical','area_prior'].forEach(k => {
                filtered[k] = w[k] !== undefined ? w[k] : DEFAULT_WEIGHTS[k];
            });
            currentWeights = filtered;
            renderWeightSliders(currentWeights);
        } catch (err) {
            console.warn('配置加载失败，使用默认权重', err);
            currentWeights = { ...DEFAULT_WEIGHTS };
            renderWeightSliders(currentWeights);
        }
    }

    async function applyWeights() {
        const btn = $('applyWeightsBtn');
        const status = $('weightStatusMsg');
        btn.disabled = true;
        status.innerHTML = '<span class="loading"></span> 更新中...';
        try {
            const resp = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ weights: currentWeights })
            });
            if (!resp.ok) throw new Error('权重更新失败');
            status.textContent = '✅ 已生效';
            setTimeout(() => { status.textContent = ''; }, 1800);
        } catch (err) {
            status.textContent = '❌ 更新失败: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    function resetWeights() {
        currentWeights = { ...DEFAULT_WEIGHTS };
        renderWeightSliders(currentWeights);
        $('weightStatusMsg').textContent = '↺ 已重置';
        setTimeout(() => { $('weightStatusMsg').textContent = ''; }, 1200);
    }

    // ---------- 历史管理 ----------
    function addHistory(type, filename, data) {
        history.unshift({ type, filename, data, timestamp: Date.now() });
        if (history.length > MAX_HISTORY) history.pop();
        renderHistory();
    }

    function renderHistory() {
        const container = $('historyContainer');
        if (!history.length) {
            container.innerHTML = '<div class="history-empty">暂无处理记录</div>';
            return;
        }
        let html = '<div class="history-list">';
        history.forEach((item, idx) => {
            const isBatch = item.data && item.data.results && Array.isArray(item.data.results);
            let badgeText;
            if (isBatch) {
                const count = item.data.results.length;
                let avgScore = 0;
                const validScores = item.data.results.filter(r => r.score !== undefined && r.score !== null).map(r => r.score);
                if (validScores.length) {
                    avgScore = validScores.reduce((a,b) => a + b, 0) / validScores.length;
                    badgeText = `批量 ${count}张 · 均分 ${avgScore.toFixed(4)}`;
                } else {
                    badgeText = `批量 ${count}张`;
                }
            } else {
                const score = item.data?.score ?? '--';
                badgeText = `得分 ${typeof score === 'number' ? score.toFixed(4) : score}`;
            }
            const name = item.filename || '未命名';
            const typeLabel = item.type === 'single' ? '单图' : '批量';
            html += `
                <div class="history-item" data-idx="${idx}">
                    <div class="left">
                        <span class="name">${name}</span>
                        <span class="meta">${typeLabel} · ${formatTime(item.timestamp)}</span>
                        <span class="badge">${badgeText}</span>
                    </div>
                    <button class="btn btn-secondary" style="padding:4px 12px;font-size:12px;" data-view="${idx}">查看</button>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
        container.querySelectorAll('[data-view]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-view'));
                const item = history[idx];
                if (!item) return;
                const modal = $('detailModal');
                const img = $('modalCropImage');
                const info = $('modalInfo');
                const d = item.data;
                if (d && d.results && Array.isArray(d.results)) {
                    img.style.display = 'none';
                    let htmlContent = `<div><strong>📦 批量结果 (${d.results.length}张)</strong></div>`;
                    d.results.forEach((res, i) => {
                        const cropSrc = res.crop_image || '';
                        const filename = res.filename || `图片 ${i+1}`;
                        const bbox = (res.bbox || []).join(', ');
                        const score = (res.score !== undefined && res.score !== null) ? res.score.toFixed(4) : '--';
                        const explanation = res.explanation || '';
                        htmlContent += `
                            <div class="batch-detail-item">
                                <img src="${cropSrc}" alt="${filename}" loading="lazy" onerror="this.style.display='none'">
                                <div class="info">
                                    <div class="fname">${filename}</div>
                                    <div>裁剪框: [${bbox}]</div>
                                    <div>得分: ${score}</div>
                                    <div style="font-size:12px;opacity:0.7;">${explanation}</div>
                                </div>
                            </div>
                        `;
                    });
                    info.innerHTML = htmlContent;
                } else {
                    img.style.display = 'block';
                    if (d && d.crop_image) img.src = d.crop_image;
                    else img.src = '';
                    info.innerHTML = `
                        <strong>${item.filename}</strong><br>
                        类型: ${item.type === 'single' ? '单图' : '批量'}<br>
                        裁剪框: [${(d?.bbox||[]).join(', ')}]<br>
                        得分: ${typeof d?.score === 'number' ? d.score.toFixed(4) : '--'}<br>
                        说明: ${d?.explanation || '无'}<br>
                        <span style="font-size:12px;opacity:0.4;">${formatTime(item.timestamp)}</span>
                    `;
                }
                modal.classList.add('active');
            });
        });
    }

    function clearHistory() {
        history = [];
        renderHistory();
    }

    // ---------- 子分数条形图 ----------
    function renderSubScoreBars(subScores) {
        if (!subScores) return '';
        const keys = ['aesthetic','saliency','composition','subject','technical','area_prior'];
        const labels = { aesthetic:'美学', saliency:'显著性', composition:'构图', subject:'主体', technical:'技术', area_prior:'面积' };
        let html = '<div class="subscore-bars">';
        keys.forEach(key => {
            const val = subScores[key] ?? 0;
            const pct = Math.min(100, val*100);
            html += `
                <div class="subscore-row">
                    <span class="label">${labels[key]}</span>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
                    <span class="value">${(val*100).toFixed(0)}%</span>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    // ---------- 单图处理 ----------
    async function processSingleImage(file) {
        const resultDiv = $('singleResult');
        clearContainer('singleResult');
        resultDiv.innerHTML = '<div style="padding:20px;text-align:center;"><span class="loading"></span> 处理中...</div>';
        const formData = new FormData();
        formData.append('image', file);
        try {
            const resp = await fetch('/api/crop', { method: 'POST', body: formData });
            if (!resp.ok) { const err = await resp.json(); throw new Error(err.error || '处理失败'); }
            const data = await resp.json();
            addHistory('single', file.name, data);
            window._lastSingleResult = data;
            // 保存原始无框图像用于手动精修
            rawImageData = data.raw_image || data.original_image; // fallback
            // 保存带框图像用于智能裁剪展示（不用于手动）
            currentImageData = data.original_image;
            // 如果手动精修 tab 当前是激活状态，立即初始化 cropper
            const manualTab = document.querySelector('#singleTabs .tab-btn[data-tab="manual"]');
            if (manualTab && manualTab.classList.contains('active')) {
                initCropper(rawImageData);
            }
            // 自动更新可视化（包含雷达图）
            updateVisualization(data);

            let html = `
                <div class="result-grid">
                    <div class="result-card">
                        <img src="${data.original_image}" alt="原图+框" loading="lazy">
                        <div class="info">🎯 最佳裁剪框 · 得分: ${formatNum(data.score)}</div>
                    </div>
                    <div class="result-card">
                        <img src="${data.crop_image}" alt="最佳裁剪" loading="lazy">
                        <div class="info">✂️ 最佳裁剪结果</div>
                    </div>
                </div>
                ${renderSubScoreBars(data.sub_scores)}
                <h3 style="margin-top:16px;">🏆 Top-3 候选裁剪</h3>
                <div class="candidate-list" id="candidateList"></div>
            `;
            resultDiv.innerHTML = html;
            const container = $('candidateList');
            if (data.top_candidates && data.top_candidates.length) {
                data.top_candidates.forEach((cand, idx) => {
                    const div = document.createElement('div');
                    div.className = 'candidate-item';
                    div.innerHTML = `
                        <img src="${cand.crop_base64 || ''}" alt="候选${idx+1}" loading="lazy">
                        <div class="score-label">得分: ${formatNum(cand.score)}</div>
                        <button class="btn btn-secondary" style="margin-top:4px;padding:4px 10px;font-size:12px;" data-base64="${cand.crop_base64 || ''}" data-idx="${idx}">⬇ 下载</button>
                    `;
                    container.appendChild(div);
                });
                container.querySelectorAll('[data-base64]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const b64 = btn.getAttribute('data-base64');
                        if (b64) downloadBase64Image(b64, `candidate_${btn.getAttribute('data-idx')}.jpg`);
                    });
                });
            } else {
                container.innerHTML = '<p style="opacity:0.5;">无候选数据</p>';
            }
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">错误: ${err.message}</div>`;
            console.error(err);
        }
    }

    // ---------- 批量处理 ----------
    async function processBatch(files) {
        const container = $('batchResult');
        clearContainer('batchResult');
        container.innerHTML = '<div style="padding:20px;text-align:center;"><span class="loading"></span> 批量处理中...</div>';
        const formData = new FormData();
        for (const f of files) formData.append('images', f);
        try {
            const resp = await fetch('/api/batch', { method: 'POST', body: formData });
            if (!resp.ok) throw new Error('批量处理失败');
            const data = await resp.json();
            batchProcessedData = data.results || [];
            renderBatchResults(batchProcessedData);
            if (batchProcessedData.length) {
                addHistory('batch', `批量 (${batchProcessedData.length}张)`, { results: batchProcessedData });
            }
        } catch (err) {
            container.innerHTML = `<div class="error">批量处理错误: ${err.message}</div>`;
        }
    }

    // ---------- 批量结果渲染 ----------
    function renderBatchResults(results) {
        const container = $('batchResult');
        if (!results || !results.length) {
            container.innerHTML = '<p style="opacity:0.4;text-align:center;padding:20px;">暂无结果</p>';
            return;
        }
        const subLabels = { aesthetic:'美学', saliency:'显著性', composition:'构图', subject:'主体', technical:'技术', area_prior:'面积' };
        const subKeys = ['aesthetic','saliency','composition','subject','technical','area_prior'];
        let html = `<div style="margin-bottom:12px;font-weight:500;opacity:0.7;">共 ${results.length} 张</div><div id="batchCardsWrapper">`;
        results.forEach((item, idx) => {
            if (item.error) {
                html += `<div class="batch-result-card" style="border-left:4px solid #b35a4a;"><div style="flex:1;"><strong>${item.filename||'未命名'}</strong> <span class="error" style="font-size:13px;padding:2px 10px;">错误: ${item.error}</span></div></div>`;
                return;
            }
            if (item.top_candidates && Array.isArray(item.top_candidates)) {
                item.top_candidates.sort((a, b) => (b.score || 0) - (a.score || 0));
            }
            const candidates = item.top_candidates || [];
            const hasCandidates = candidates.length > 0;
            const defaultImg = hasCandidates ? candidates[0].crop_base64 : item.crop_image;
            const defaultScore = hasCandidates ? candidates[0].score : item.score;
            const defaultBbox = hasCandidates ? (candidates[0].bbox || item.bbox) : item.bbox;
            const defaultOrig = hasCandidates ? (candidates[0].original_with_bbox || item.original_image) : item.original_image;
            const scoreId = `score_${idx}`;
            const bboxId = `bbox_${idx}`;
            const cropImgId = `cropImg_${idx}`;
            const origImgId = `origImg_${idx}`;
            let subHtml = '';
            if (item.sub_scores && typeof item.sub_scores === 'object') {
                const parts = [];
                subKeys.forEach(key => {
                    const val = item.sub_scores[key];
                    if (val !== undefined && val !== null) {
                        const pct = (val * 100).toFixed(0);
                        parts.push(`<span class="item"><span class="dot"></span>${subLabels[key]||key}: <span class="val">${pct}%</span></span>`);
                    }
                });
                if (parts.length) subHtml = `<div class="batch-subscore-compact">${parts.join('')}</div>`;
            }
            let candButtons = '';
            if (hasCandidates) {
                const maxShow = Math.min(candidates.length, 5);
                for (let i = 0; i < maxShow; i++) {
                    const active = i === 0 ? 'active' : '';
                    candButtons += `<button class="cand-btn ${active}" data-item-idx="${idx}" data-cand-idx="${i}">Top${i+1}</button>`;
                }
            }
            html += `
                <div class="batch-result-card" data-item-idx="${idx}">
                    <div class="batch-thumbs">
                        <div class="batch-thumb-wrapper">
                            <img id="${origImgId}" src="${defaultOrig}" alt="原图" loading="lazy" onerror="this.style.display='none'">
                            <div class="label">📷 原图</div>
                        </div>
                        <div class="batch-thumb-wrapper">
                            <img id="${cropImgId}" src="${defaultImg}" alt="裁剪" loading="lazy" onerror="this.style.display='none'">
                            <div class="label">✂️ 裁剪</div>
                            ${candButtons ? `<div class="cand-selector">${candButtons}</div>` : ''}
                        </div>
                    </div>
                    <div class="batch-info">
                        <div class="top-row">
                            <span class="fname">${item.filename||'未命名'}</span>
                            <span class="bbox" id="${bboxId}">框: [${(defaultBbox||[]).join(', ')}]</span>
                            <span class="score" id="${scoreId}">得分: ${formatNum(defaultScore)}</span>
                        </div>
                        ${subHtml}
                    </div>
                    <div class="batch-actions">
                        <button class="btn btn-secondary download-crop-btn" data-item-idx="${idx}">⬇ 下载</button>
                    </div>
                </div>
            `;
        });
        html += `</div><div class="btn-group" style="margin-top:12px;"><button class="btn btn-secondary" id="batchDownloadCropsBtn">📦 批量下载所有裁剪图 (ZIP)</button></div>`;
        container.innerHTML = html;

        container.querySelectorAll('.cand-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const itemIdx = parseInt(this.getAttribute('data-item-idx'));
                const candIdx = parseInt(this.getAttribute('data-cand-idx'));
                const item = results[itemIdx];
                if (!item || !item.top_candidates || !item.top_candidates[candIdx]) return;
                const card = this.closest('.batch-result-card');
                if (!card) return;
                const origImg = card.querySelector(`#origImg_${itemIdx}`);
                const cropImg = card.querySelector(`#cropImg_${itemIdx}`);
                const scoreSpan = card.querySelector(`#score_${itemIdx}`);
                const bboxSpan = card.querySelector(`#bbox_${itemIdx}`);
                const cand = item.top_candidates[candIdx];
                if (origImg) origImg.src = cand.original_with_bbox || item.original_image;
                if (cropImg) cropImg.src = cand.crop_base64 || '';
                if (scoreSpan) scoreSpan.textContent = `得分: ${formatNum(cand.score)}`;
                if (bboxSpan) bboxSpan.textContent = `框: [${(cand.bbox || item.bbox || []).join(', ')}]`;
                const siblings = this.parentElement.querySelectorAll('.cand-btn');
                siblings.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        container.querySelectorAll('.download-crop-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const itemIdx = parseInt(this.getAttribute('data-item-idx'));
                const item = results[itemIdx];
                if (!item) return;
                const card = this.closest('.batch-result-card');
                const cropImg = card ? card.querySelector(`#cropImg_${itemIdx}`) : null;
                let src = cropImg ? cropImg.src : (item.crop_image || '');
                if (!src || src === '') { alert('该图片无裁剪图数据'); return; }
                downloadBase64Image(src, `crop_${item.filename || itemIdx}.jpg`);
            });
        });

        const zipBtn = $('batchDownloadCropsBtn');
        if (zipBtn) {
            zipBtn.addEventListener('click', () => batchDownloadCrops(results));
        }
    }

    async function batchDownloadCrops(results) {
        const wrapper = $('batchCardsWrapper');
        if (!wrapper) { alert('没有可下载的裁剪图'); return; }
        const cards = wrapper.querySelectorAll('.batch-result-card');
        const validItems = [];
        cards.forEach(card => {
            const idx = parseInt(card.getAttribute('data-item-idx'));
            const item = results[idx];
            if (!item) return;
            const cropImg = card.querySelector(`#cropImg_${idx}`);
            const src = cropImg ? cropImg.src : (item.crop_image || '');
            if (src && src !== '') validItems.push({ ...item, crop_image: src });
        });
        if (!validItems.length) { alert('没有可下载的裁剪图'); return; }
        try {
            const resp = await fetch('/api/batch_download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ results: validItems })
            });
            if (!resp.ok) throw new Error('批量下载失败');
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'crops.zip';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (err) {
            alert('批量下载失败: ' + err.message);
        }
    }

    // ---------- 导出 ----------
    async function exportResults(format) {
        if (!batchProcessedData.length) { alert('没有批量处理结果可导出'); return; }
        const exportData = batchProcessedData.map(item => ({
            filename: item.filename || 'unknown',
            bbox: item.bbox || [],
            score: item.score || 0,
            error: item.error || null
        }));
        try {
            const resp = await fetch('/api/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ results: exportData, format })
            });
            if (!resp.ok) throw new Error('导出失败');
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `predictions.${format === 'csv' ? 'csv' : 'json'}`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (err) {
            alert('导出失败: ' + err.message);
        }
    }

    function clearBatchResults() {
        batchProcessedData = [];
        $('batchResult').innerHTML = '<p style="opacity:0.3;text-align:center;padding:20px;">已清空</p>';
    }

    // ---------- 模态框 ----------
    function initModal() {
        const modal = $('detailModal');
        const closeBtn = modal.querySelector('.modal-close');
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('active'); });
    }

    // ============================================================
    //  【手动精修模块】使用原始无框图像
    // ============================================================
    function initCropper(imageSrc) {
        const img = document.getElementById('manualImage');
        if (!imageSrc) {
            img.src = '';
            return;
        }
        img.src = imageSrc;
        img.onload = function() {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            cropper = new Cropper(img, {
                aspectRatio: NaN,
                viewMode: 1,
                dragMode: 'crop',
                autoCropArea: 0.65,
                responsive: true,
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
            applyRatio(getActiveRatio());
        };
        img.onerror = function() { alert('图片加载失败，请重新上传。'); };
    }

    function getActiveRatio() {
        const active = document.querySelector('#ratioBtns .ratio-btn.active');
        return active ? active.dataset.ratio : 'free';
    }

    function applyRatio(ratio) {
        if (!cropper) return;
        let aspect = NaN;
        if (ratio === '1:1') aspect = 1;
        else if (ratio === '4:3') aspect = 4/3;
        else if (ratio === '16:9') aspect = 16/9;
        else if (ratio === '3:2') aspect = 3/2;
        else if (ratio === 'original') {
            const img = document.getElementById('manualImage');
            if (img.naturalWidth && img.naturalHeight) {
                aspect = img.naturalWidth / img.naturalHeight;
            }
        }
        cropper.setAspectRatio(aspect);
    }

    function resetCrop() {
        if (cropper) {
            cropper.reset();
            cropper.clear();
            cropper.crop();
        }
    }

    function getCroppedImageData() {
        if (!cropper) return null;
        const data = cropper.getData();
        const image = document.getElementById('manualImage');
        if (!image.complete || !image.naturalWidth) return null;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const srcWidth = image.naturalWidth;
        const srcHeight = image.naturalHeight;
        const displayWidth = image.width;
        const displayHeight = image.height;
        const scaleX = srcWidth / displayWidth;
        const scaleY = srcHeight / displayHeight;
        const cropX = data.x * scaleX;
        const cropY = data.y * scaleY;
        const cropW = data.width * scaleX;
        const cropH = data.height * scaleY;
        canvas.width = cropW;
        canvas.height = cropH;
        ctx.drawImage(image, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        const imageData = ctx.getImageData(0, 0, cropW, cropH);
        applyAdjustmentsToImageData(imageData, adjustParams);
        ctx.putImageData(imageData, 0, 0);
        return canvas.toDataURL('image/jpeg', 0.92);
    }

    function applyAdjustmentsToImageData(imageData, params) {
        const data = imageData.data;
        const len = data.length;
        const brightness = params.brightness / 100;        // -1 ~ 1
        const saturation = params.saturation / 100;        // -1 ~ 1
        const hue = params.hue;                            // -180 ~ 180
        const contrastFactor = 1 + params.contrast / 100; // 0 ~ 2

        for (let i = 0; i < len; i += 4) {
            let r = data[i];
            let g = data[i+1];
            let b = data[i+2];

        // 1. 色调调整（保持原逻辑）
            if (hue !== 0) {
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const delta = max - min;
                let h = 0, s = 0, v = max;
                if (max !== 0) s = delta / max;
                if (delta !== 0) {
                    if (max === r) h = (g - b) / delta;
                    else if (max === g) h = 2 + (b - r) / delta;
                    else h = 4 + (r - g) / delta;
                    h *= 60;
                    if (h < 0) h += 360;
                }
                h = (h + hue) % 360;
                if (h < 0) h += 360;
                const c = v * s;
                const x = c * (1 - Math.abs((h / 60) % 2 - 1));
                const m = v - c;
                let r1, g1, b1;
                if (h < 60) { r1 = c; g1 = x; b1 = 0; }
                else if (h < 120) { r1 = x; g1 = c; b1 = 0; }
                else if (h < 180) { r1 = 0; g1 = c; b1 = x; }
                else if (h < 240) { r1 = 0; g1 = x; b1 = c; }
                else if (h < 300) { r1 = x; g1 = 0; b1 = c; }
                else { r1 = c; g1 = 0; b1 = x; }
                r = (r1 + m) * 255;
                g = (g1 + m) * 255;
                b = (b1 + m) * 255;
            }

        // 2. 饱和度调整
            if (saturation !== 0) {
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                const factorSat = 1 + saturation;
                r = gray + (r - gray) * factorSat;
                g = gray + (g - gray) * factorSat;
                b = gray + (b - gray) * factorSat;
            }

        // 3. 对比度调整（正确线性系数）
            r = (r - 128) * contrastFactor + 128;
            g = (g - 128) * contrastFactor + 128;
            b = (b - 128) * contrastFactor + 128;

        // 4. 亮度调整
            if (brightness !== 0) {
                r += brightness * 128;
                g += brightness * 128;
                b += brightness * 128;
            }

        // 裁剪到有效范围
            data[i] = Math.min(255, Math.max(0, Math.round(r)));
            data[i+1] = Math.min(255, Math.max(0, Math.round(g)));
            data[i+2] = Math.min(255, Math.max(0, Math.round(b)));
        }
    }

    // 更新手动精修图像（应用调整参数后重绘）
    function updateManualImage() {
        if (!rawImageData) return;
        const img = document.getElementById('manualImage');
        // 从原始图像加载并应用调整
        const tempImg = new Image();
        tempImg.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = tempImg.width;
            canvas.height = tempImg.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(tempImg, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            applyAdjustmentsToImageData(imageData, adjustParams);
            ctx.putImageData(imageData, 0, 0);
            const adjustedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
            img.src = adjustedDataUrl;
            img.onload = function() {
                if (cropper) {
                    cropper.destroy();
                    cropper = null;
                }
                cropper = new Cropper(img, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    dragMode: 'crop',
                    autoCropArea: 0.65,
                    responsive: true,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                });
                applyRatio(getActiveRatio());
            };
        };
        tempImg.src = rawImageData;  // 使用原始图像
    }

    function resetAdjustments() {
        adjustParams = { brightness: 0, contrast: 0, saturation: 0, hue: 0 };
        document.getElementById('brightnessSlider').value = 0;
        document.getElementById('contrastSlider').value = 0;
        document.getElementById('saturationSlider').value = 0;
        document.getElementById('hueSlider').value = 0;
        document.getElementById('brightnessVal').textContent = '0';
        document.getElementById('contrastVal').textContent = '0';
        document.getElementById('saturationVal').textContent = '0';
        document.getElementById('hueVal').textContent = '0';
        updateManualImage();
    }

    function setupManualTab() {
        document.querySelectorAll('#ratioBtns .ratio-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#ratioBtns .ratio-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                applyRatio(this.dataset.ratio);
            });
        });

        ['brightness', 'contrast', 'saturation', 'hue'].forEach(id => {
            const slider = document.getElementById(id+'Slider');
            const valSpan = document.getElementById(id+'Val');
            slider.addEventListener('input', function() {
                const val = parseInt(this.value);
                valSpan.textContent = val;
                adjustParams[id] = val;
                updateManualImage();
            });
        });

        document.getElementById('resetAdjustmentsBtn').addEventListener('click', resetAdjustments);
        document.getElementById('manualResetBtn').addEventListener('click', resetCrop);
        document.getElementById('manualDownloadBtn').addEventListener('click', function() {
            const dataUrl = getCroppedImageData();
            if (dataUrl) {
                downloadBase64Image(dataUrl, 'manual_crop.jpg');
            } else {
                alert('请先裁剪图片');
            }
        });
        document.getElementById('manualApplyOriginalBtn').addEventListener('click', function() {
            resetAdjustments();
            if (cropper) {
                cropper.reset();
                cropper.clear();
                cropper.crop();
            }
        });
    }

    // ============================================================
    //  【可视化诊断】雷达图自动呈现
    // ============================================================
    function updateVisualization(data) {
        const salImg = document.getElementById('vizSaliency');
        const objImg = document.getElementById('vizObjects');
        const salPlaceholder = document.getElementById('saliencyPlaceholder');
        const objPlaceholder = document.getElementById('objectsPlaceholder');

        if (data.saliency_vis) {
            salImg.src = data.saliency_vis;
            salImg.style.display = 'block';
            salPlaceholder.style.display = 'none';
        } else {
            if (data.original_image) {
                salImg.src = data.original_image;
                salImg.style.display = 'block';
                salPlaceholder.style.display = 'none';
                salPlaceholder.textContent = '（热力图需后端支持）';
                salPlaceholder.style.display = 'block';
                salPlaceholder.style.color = 'rgba(30,47,58,0.3)';
                salPlaceholder.style.fontSize = '12px';
                salPlaceholder.style.padding = '4px';
            } else {
                salImg.style.display = 'none';
                salPlaceholder.style.display = 'block';
                salPlaceholder.textContent = '⏳ 等待后端支持';
            }
        }

        if (data.object_vis) {
            objImg.src = data.object_vis;
            objImg.style.display = 'block';
            objPlaceholder.style.display = 'none';
        } else {
            if (data.original_image) {
                objImg.src = data.original_image;
                objImg.style.display = 'block';
                objPlaceholder.style.display = 'none';
                objPlaceholder.textContent = '（检测图需后端支持）';
                objPlaceholder.style.display = 'block';
                objPlaceholder.style.color = 'rgba(30,47,58,0.3)';
                objPlaceholder.style.fontSize = '12px';
                objPlaceholder.style.padding = '4px';
            } else {
                objImg.style.display = 'none';
                objPlaceholder.style.display = 'block';
                objPlaceholder.textContent = '⏳ 等待后端支持';
            }
        }

        const ctx = document.getElementById('radarChart').getContext('2d');
        if (radarChartInstance) radarChartInstance.destroy();
        const scores = data.sub_scores || { aesthetic:0.5, saliency:0.5, composition:0.5, subject:0.5, technical:0.5, area_prior:0.5 };
        const radarData = {
            labels: ['美学', '显著性', '构图', '主体', '技术', '面积先验'],
            datasets: [{
                label: '评分',
                data: [scores.aesthetic||0, scores.saliency||0, scores.composition||0, scores.subject||0, scores.technical||0, scores.area_prior||0],
                backgroundColor: 'rgba(127,165,185,0.2)',
                borderColor: '#7fa5b9',
                pointBackgroundColor: '#7fa5b9',
                borderWidth: 2,
            }]
        };
        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: radarData,
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: { r: { beginAtZero: true, max: 1, ticks: { stepSize: 0.2 } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    // ---------- Tab 切换（手动精修tab激活时初始化cropper） ----------
    document.querySelectorAll('#singleTabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#singleTabs .tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const tab = this.dataset.tab;
            document.querySelectorAll('#singleTabContent .tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');

            if (tab === 'manual') {
                // 当切换到手动精修时，如果有原始图像数据，初始化cropper
                if (rawImageData) {
                    // 如果已经有cropper且图片源相同，则跳过重新初始化（或仅重置）
                    const img = document.getElementById('manualImage');
                    if (!cropper || img.src !== rawImageData) {
                        initCropper(rawImageData);
                    } else {
                        // 容器显示后，调整cropper尺寸
                        if (cropper) {
                            setTimeout(() => cropper.resize(), 50);
                        }
                    }
                } else {
                    // 没有图片，清空显示
                    document.getElementById('manualImage').src = '';
                    if (cropper) {
                        cropper.destroy();
                        cropper = null;
                    }
                }
            }

            if (tab === 'viz') {
                const last = window._lastSingleResult;
                if (last) {
                    updateVisualization(last);
                }
            }
        });
    });

    // ---------- 刷新可视化按钮 ----------
    document.getElementById('refreshVizBtn').addEventListener('click', function() {
        const last = window._lastSingleResult;
        if (last) {
            updateVisualization(last);
        } else {
            alert('请先上传图片并运行智能裁剪');
        }
    });

    // ---------- 初始化 ----------
    function init() {
        loadConfig();
        initModal();
        renderHistory();
        setupManualTab();

        // 单图上传
        const singleArea = $('singleUploadArea');
        const singleInput = $('singleFileInput');
        singleArea.addEventListener('click', () => singleInput.click());
        singleArea.addEventListener('dragover', (e) => e.preventDefault());
        singleArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) processSingleImage(file);
        });
        singleInput.addEventListener('change', (e) => {
            if (e.target.files[0]) processSingleImage(e.target.files[0]);
            e.target.value = '';
        });

        // 批量上传
        const batchArea = $('batchUploadArea');
        const batchInput = $('batchFileInput');
        batchArea.addEventListener('click', () => batchInput.click());
        batchArea.addEventListener('dragover', (e) => e.preventDefault());
        batchArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length) processBatch(files);
        });
        batchInput.addEventListener('change', (e) => {
            if (e.target.files.length) processBatch(Array.from(e.target.files));
            e.target.value = '';
        });

        // 权重按钮
        $('applyWeightsBtn').addEventListener('click', applyWeights);
        $('resetWeightsBtn').addEventListener('click', resetWeights);

        // 导出 & 清空
        $('exportJsonBtn').addEventListener('click', () => exportResults('json'));
        $('exportCsvBtn').addEventListener('click', () => exportResults('csv'));
        $('clearBatchBtn').addEventListener('click', clearBatchResults);
        $('clearHistoryBtn').addEventListener('click', clearHistory);

        console.log('AestheticCropper 已启动，手动裁剪默认大图，雷达图自动呈现');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
